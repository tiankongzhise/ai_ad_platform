version: '3.9'

services:
  # FastAPI 应用
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://user:pass@mysql:3306/eduadcrm
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - mysql
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery Worker
  celery-worker:
    build: .
    environment:
      - DATABASE_URL=mysql+aiomysql://user:pass@mysql:3306/eduadcrm
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - mysql
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info -c 4

  # Celery Beat (定时任务调度器)
  celery-beat:
    build: .
    environment:
      - DATABASE_URL=mysql+aiomysql://user:pass@mysql:3306/eduadcrm
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=eduadcrm
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data: